# Declarative Cloud Run spec for the ledger API.
# Apply with: gcloud run services replace deployment/gcp/service.yaml --region REGION
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ledger-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cloudsql-instances: PROJECT:REGION:ledgerlab-db
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/ledgerlab/ledger-api:latest
          ports:
            - containerPort: 4001
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: LEDGER_API_PORT
              value: "4001"
            - name: CORS_ORIGINS
              value: https://ledgerlab.example.com
          envFrom:
            - secretRef:
                name: ledgerlab-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 4001
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            periodSeconds: 30
