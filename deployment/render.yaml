# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
#
# This provisions:
#   - PostgreSQL (managed)
#   - ledger-api    (Docker, public; runs migrations as a pre-deploy step)
#   - reporting-api (Docker, public; calls ledger-api over the private network)
#   - web           (static SPA)
#
# After the first deploy, set the `sync: false` values in the dashboard.

databases:
  - name: ledgerlab-db
    databaseName: ledgerlab
    user: ledgerlab
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- ledger API
  - type: web
    name: ledgerlab-ledger-api
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 2
    dockerfilePath: ./deployment/Dockerfile.ledger-api
    dockerContext: .
    healthCheckPath: /health
    # Migrations run once per deploy, before the new version serves traffic.
    # Never on container boot.
    preDeployCommand: pnpm --filter @ledgerlab/db migrate:sql
    autoDeploy: true
    disk: []
    envVars:
      - key: LEDGER_API_PORT
        value: 4001
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerlab-db
          property: connectionString
      - key: DB_POOL_MAX
        value: 10
      - key: DB_IDLE_TIMEOUT_SECONDS
        value: 30
      - key: CORS_ORIGINS
        sync: false # set to your dashboard origin, e.g. https://ledgerlab.example.com
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: RATE_LIMIT_MAX
        value: 120
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000

  # ------------------------------------------------------------- reporting API
  - type: web
    name: ledgerlab-reporting-api
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 2
    dockerfilePath: ./deployment/Dockerfile.reporting-api
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: REPORTING_API_PORT
        value: 4002
      # Private-network URL; Render resolves service names inside the region.
      - key: LEDGER_API_URL
        value: http://ledgerlab-ledger-api:4001
      - key: INTERNAL_API_TOKEN
        fromService:
          type: web
          name: ledgerlab-ledger-api
          envVarKey: INTERNAL_API_TOKEN
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_MAX
        value: 120
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000

  # --------------------------------------------------------------- dashboard
  - type: web
    name: ledgerlab-web
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm --filter @ledgerlab/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'
    envVars:
      - key: VITE_LEDGER_API_URL
        sync: false # e.g. https://api.ledgerlab.example.com
      - key: VITE_REPORTING_API_URL
        sync: false # e.g. https://reports.ledgerlab.example.com
